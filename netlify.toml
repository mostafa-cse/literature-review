[build]
  publish = "Frontend"
  command = ""

[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[redirects]]
  from = "/api/*"
  to = "https://literature-review-8rxv.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://literature-review-8rxv.onrender.com/uploads/:splat"
  status = 200
  force = true

