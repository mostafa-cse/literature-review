<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- Premium 24k Gold Gradient -->
    <linearGradient id="lsGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="75%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Warm Highlight Gradient -->
    <linearGradient id="lsHighlightGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.4" />
    </linearGradient>

    <!-- Radial Sphere Core Glow -->
    <radialGradient id="lsSphereCore" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="1" />
      <stop offset="45%" stop-color="#F59E0B" stop-opacity="0.8" />
      <stop offset="85%" stop-color="#B45309" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#78350F" stop-opacity="1" />
    </radialGradient>

    <!-- Outer Ambient Glow Filter -->
    <filter id="lsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Outer Orbit Rings -->
  <circle cx="50" cy="50" r="45" stroke="url(#lsGoldGrad)" stroke-width="1.25" stroke-dasharray="3 3" opacity="0.4" />
  <ellipse cx="50" cy="50" rx="42" ry="18" stroke="url(#lsGoldGrad)" stroke-width="1.2" opacity="0.5" transform="rotate(-25 50 50)" />
  <circle cx="20" cy="36" r="2" fill="#FCD34D" filter="url(#lsGlow)" />
  <circle cx="80" cy="64" r="2" fill="#FCD34D" filter="url(#lsGlow)" />

  <!-- The Celestial Knowledge Sphere (Upper Center) -->
  <g id="celestial-sphere" transform="translate(0, -2)">
    <circle cx="50" cy="40" r="17" fill="url(#lsSphereCore)" />
    <!-- Sphere Longitudes & Latitudes -->
    <ellipse cx="50" cy="40" rx="9" ry="17" stroke="url(#lsHighlightGrad)" stroke-width="1" fill="none" opacity="0.75" />
    <path d="M 33 40 Q 50 47 67 40" stroke="url(#lsHighlightGrad)" stroke-width="1" fill="none" opacity="0.7" />
    <path d="M 36 32 Q 50 37 64 32" stroke="url(#lsHighlightGrad)" stroke-width="0.8" fill="none" opacity="0.6" />
    <!-- Top Apex Radiance -->
    <circle cx="50" cy="27" r="1.5" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- The Open Research Book / Dynamic Wings -->
  <!-- Left Outer Page Wing -->
  <path d="M 50 78 C 38 72 24 63 15 45 C 22 55 35 62 50 67 Z" 
        fill="url(#lsGoldGrad)" opacity="0.8" />
  
  <!-- Right Outer Page Wing -->
  <path d="M 50 78 C 62 72 76 63 85 45 C 78 55 65 62 50 67 Z" 
        fill="url(#lsGoldGrad)" opacity="0.8" />

  <!-- Left Inner Book Page -->
  <path d="M 50 74 C 36 67 22 58 19 39 C 28 50 38 56 50 61 Z" 
        fill="url(#lsGoldGrad)" />
  <path d="M 50 74 C 36 67 22 58 19 39" 
        stroke="#FEF3C7" stroke-width="1.2" fill="none" stroke-linecap="round" />

  <!-- Right Inner Book Page -->
  <path d="M 50 74 C 64 67 78 58 81 39 C 72 50 62 56 50 61 Z" 
        fill="url(#lsGoldGrad)" />
  <path d="M 50 74 C 64 67 78 58 81 39" 
        stroke="#FEF3C7" stroke-width="1.2" fill="none" stroke-linecap="round" />

  <!-- Book Spine & Pedestal Base -->
  <path d="M 50 61 L 50 82" stroke="#FEF3C7" stroke-width="2" stroke-linecap="round" />
  <polygon points="50,77 44,83 56,83" fill="url(#lsGoldGrad)" />
  <circle cx="50" cy="85" r="2" fill="#FCD34D" />
</svg>
