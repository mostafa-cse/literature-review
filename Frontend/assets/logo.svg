<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- Ultra-luxury 24K Gold Metallic Gradient -->
    <linearGradient id="lsGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Warm Highlight Sheen Gradient -->
    <linearGradient id="lsHighlightGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.3" />
    </linearGradient>

    <!-- Celestial Sphere Glowing Core -->
    <radialGradient id="lsSphereCore" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="1" />
      <stop offset="35%" stop-color="#F59E0B" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#D97706" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#92400E" stop-opacity="1" />
    </radialGradient>

    <!-- Subtle Depth Shadow -->
    <filter id="lsSoftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F59E0B" flood-opacity="0.4" />
    </filter>
  </defs>

  <g id="litsphere-emblem" filter="url(#lsSoftGlow)">
    <!-- The Celestial Knowledge Sphere -->
    <g id="knowledge-sphere">
      <!-- Main Sphere Body -->
      <circle cx="50" cy="38" r="19" fill="url(#lsSphereCore)" />
      <!-- Longitudinal Meridian Line -->
      <ellipse cx="50" cy="38" rx="10" ry="19" stroke="url(#lsHighlightGrad)" stroke-width="1.2" fill="none" opacity="0.8" />
      <!-- Latitudinal Equator Lines -->
      <path d="M 31 38 Q 50 46 69 38" stroke="url(#lsHighlightGrad)" stroke-width="1.1" fill="none" opacity="0.75" />
      <path d="M 34 29 Q 50 35 66 29" stroke="url(#lsHighlightGrad)" stroke-width="0.9" fill="none" opacity="0.65" />
      <!-- Star Apex Highlight -->
      <circle cx="48" cy="24" r="1.75" fill="#FFFFFF" opacity="0.95" />
    </g>

    <!-- The Open Literature Wings / Scientific Pages -->
    <!-- Left Outer Wing Page -->
    <path d="M 50 82 C 37 75 21 64 12 43 C 20 54 34 62 50 68 Z" 
          fill="url(#lsGoldGrad)" opacity="0.75" />

    <!-- Right Outer Wing Page -->
    <path d="M 50 82 C 63 75 79 64 88 43 C 80 54 66 62 50 68 Z" 
          fill="url(#lsGoldGrad)" opacity="0.75" />

    <!-- Left Inner Book Page -->
    <path d="M 50 78 C 34 70 19 60 16 38 C 26 50 37 57 50 63 Z" 
          fill="url(#lsGoldGrad)" />
    <path d="M 50 78 C 34 70 19 60 16 38" 
          stroke="#FEF3C7" stroke-width="1.4" fill="none" stroke-linecap="round" />

    <!-- Right Inner Book Page -->
    <path d="M 50 78 C 66 70 81 60 84 38 C 74 50 63 57 50 63 Z" 
          fill="url(#lsGoldGrad)" />
    <path d="M 50 78 C 66 70 81 60 84 38" 
          stroke="#FEF3C7" stroke-width="1.4" fill="none" stroke-linecap="round" />

    <!-- Center Spine & Keystone Base -->
    <path d="M 50 63 L 50 86" stroke="#FEF3C7" stroke-width="2.2" stroke-linecap="round" />
    <polygon points="50,81 43,87 57,87" fill="url(#lsGoldGrad)" />
    <circle cx="50" cy="89" r="2.2" fill="#FCD34D" />
  </g>
</svg>
