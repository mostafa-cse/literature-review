<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LitSphere — Project Presentation | Dept. of CSE, JUST</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #16325B;
      --dark-navy: #0F2240;
      --gold: #C69214;
      --gold-light: #FAF3E0;
      --bg: #0B132B;
      --card-bg: #FFFFFF;
      --text: #1E293B;
      --subtext: #64748B;
      --border: #E2E8F0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: #F8FAFC;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Global Header Bar */
    header {
      height: 48px;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-badge {
      background: var(--gold);
      color: #FFFFFF;
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      color: #FFFFFF;
      letter-spacing: -0.01em;
    }

    .brand-subtitle {
      font-size: 0.75rem;
      color: #94A3B8;
      border-left: 1px solid rgba(255, 255, 255, 0.2);
      padding-left: 0.75rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #F8FAFC;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .btn-gold {
      background: var(--gold);
      border-color: var(--gold);
      color: #FFFFFF;
    }

    .btn-gold:hover {
      background: #B38312;
      border-color: #B38312;
    }

    /* Main Stage */
    main {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: radial-gradient(circle at center, #1E293B 0%, #0F172A 100%);
    }

    .slide-viewport {
      position: relative;
      width: 100%;
      max-width: 1280px;
      aspect-ratio: 16 / 9;
      background: #000000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      transition: opacity 0.2s ease;
    }

    /* Navigation Overlays */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(4px);
      z-index: 30;
      opacity: 0.3;
    }

    .slide-viewport:hover .nav-arrow {
      opacity: 0.9;
    }

    .nav-arrow:hover {
      background: var(--navy);
      border-color: var(--gold);
      transform: translateY(-50%) scale(1.1);
      opacity: 1;
    }

    .nav-prev { left: 1rem; }
    .nav-next { right: 1rem; }

    /* Bottom Control Bar */
    footer {
      height: 54px;
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      z-index: 50;
    }

    .counter {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--gold);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .counter span {
      color: #94A3B8;
      font-weight: 500;
      font-size: 0.8rem;
    }

    .progress-bar-container {
      flex: 1;
      max-width: 480px;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      margin: 0 1.5rem;
      overflow: hidden;
      cursor: pointer;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--navy) 0%, var(--gold) 100%);
      width: 4%;
      transition: width 0.3s ease;
      border-radius: 3px;
    }

    .shortcuts-hint {
      font-size: 0.72rem;
      color: #94A3B8;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .kbd {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 3px;
      padding: 0.1rem 0.35rem;
      font-family: monospace;
      font-size: 0.7rem;
      color: #F8FAFC;
    }

    /* Thumbnail Drawer Grid */
    .thumb-modal {
      position: fixed;
      inset: 0;
      background: rgba(11, 19, 43, 0.95);
      backdrop-filter: blur(12px);
      z-index: 100;
      display: none;
      flex-direction: column;
      padding: 2rem;
      overflow-y: auto;
    }

    .thumb-modal.open {
      display: flex;
    }

    .thumb-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }

    .thumb-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: white;
    }

    .thumb-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.25rem;
      padding-bottom: 2rem;
    }

    .thumb-card {
      background: #1E293B;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .thumb-card:hover {
      border-color: var(--gold);
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
    }

    .thumb-card.active {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px var(--gold);
    }

    .thumb-card img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
    }

    .thumb-number {
      position: absolute;
      top: 6px;
      left: 6px;
      background: var(--navy);
      color: white;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.15rem 0.4rem;
      border-radius: 3px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .thumb-card-title {
      padding: 0.5rem;
      font-size: 0.72rem;
      font-weight: 600;
      color: #CBD5E1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Fullscreen adjustment */
    :fullscreen body {
      background: #000000;
    }
    :fullscreen main {
      padding: 0;
      background: #000000;
    }
    :fullscreen .slide-viewport {
      max-width: 100vw;
      max-height: 100vh;
      border-radius: 0;
      box-shadow: none;
    }
  </style>
</head>
<body>

  <!-- Top Global Header -->
  <header>
    <div class="brand">
      <div class="brand-title">LitSphere Presentation Deck</div>
      <div class="brand-subtitle">Dept. of Computer Science & Engineering, JUST</div>
    </div>
    <div class="header-actions">
      <button class="btn" id="btnThumbnails" title="View all slides (T)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        Grid (T)
      </button>
      <button class="btn" id="btnFullscreen" title="Toggle Fullscreen (F)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
        Fullscreen (F)
      </button>
      <a href="LitSphere_PreDefense.pptx" class="btn" style="background: rgba(198, 146, 20, 0.2); border-color: var(--gold); color: #F8FAFC;" download>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        Download PPTX (White Theme)
      </a>
      <a href="LitSphere_PreDefense.pdf" class="btn btn-gold" target="_blank" download>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        Download PDF
      </a>
    </div>
  </header>

  <!-- Main Presentation Stage -->
  <main>
    <div class="slide-viewport" id="viewport">
      <button class="nav-arrow nav-prev" id="prevBtn" title="Previous Slide (Left Arrow / PageUp)">&#10094;</button>
      <img id="currentSlideImg" class="slide-image" src="slide-01.png" alt="LitSphere Slide">
      <button class="nav-arrow nav-next" id="nextBtn" title="Next Slide (Right Arrow / Space / PageDown)">&#10095;</button>
    </div>
  </main>

  <!-- Bottom Control Bar -->
  <footer>
    <div class="counter">
      <span id="currentNum">1</span> / <span id="totalNum">24</span>
      <span style="margin-left: 0.5rem;" id="slideTitle">Title Slide</span>
    </div>
    
    <div class="progress-bar-container" id="progressBarContainer" title="Click to jump to slide">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="shortcuts-hint">
      <span><span class="kbd">&#8592;</span> / <span class="kbd">&#8594;</span> Navigate</span>
      <span><span class="kbd">Space</span> Next</span>
      <span><span class="kbd">F</span> Fullscreen</span>
      <span><span class="kbd">T</span> Grid</span>
    </div>
  </footer>

  <!-- Slide Thumbnail Modal -->
  <div class="thumb-modal" id="thumbModal">
    <div class="thumb-header">
      <div class="thumb-title">Slide Navigator (28 Slides)</div>
      <button class="btn btn-gold" id="btnCloseThumbs">Close (Esc)</button>
    </div>
    <div class="thumb-grid" id="thumbGrid"></div>
  </div>

  <script>
    const totalSlides = 28;
    let currentSlide = 1;

    const slideTitles = [
      "LitSphere: A Collaborative Systematic Literature Review, Benchmark, and Research Synthesis Platform",
      "Introduction & Research Motivation",
      "Existing Systems & Limitations",
      "LitSphere: Proposed System Architecture",
      "Feature Comparison: LitSphere vs Existing Tools",
      "Advanced Features: LitSphere Advantage (Part 1)",
      "Advanced Features: LitSphere Advantage (Part 2)",
      "System Architecture & Technology Stack",
      "Expected Functional Modules",
      "12-Month Project Timeline (Gantt Overview)",
      "Development Phases & Milestone Targets",
      "Section Breaker: 6-Month Progress Overview",
      "Progress Summary: Month 1 to 6 (55%)",
      "Completed Modules (Month 1 to 6)",
      "Remaining Work (Month 7 to 12)",
      "System Design: Entity-Relationship Diagram (ERD)",
      "System Design: Use Case Diagram",
      "Section Breaker: UI Implementation & Live Demo",
      "UI: User Authentication & Session Login",
      "UI: Researcher Registration & Account Setup",
      "UI: Researcher Profile & Institutional Affiliation",
      "UI: Project Dashboard & Review Metrics",
      "UI: Survey Workspace & Literature Ingestion",
      "UI: Split-Screen Dual-Pane Paper Reviewer",
      "UI: Interactive Master Synthesis Matrix Grid",
      "UI: Thematic Clustering & Synthesis Taxonomy",
      "UI: Benchmark Sample & Cluster Details",
      "Conclusion & Project Outlook"
    ];

    const slideImg = document.getElementById('currentSlideImg');
    const currentNumEl = document.getElementById('currentNum');
    const totalNumEl = document.getElementById('totalNum');
    const slideTitleEl = document.getElementById('slideTitle');
    const progressBar = document.getElementById('progressBar');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const thumbModal = document.getElementById('thumbModal');
    const thumbGrid = document.getElementById('thumbGrid');
    const btnThumbnails = document.getElementById('btnThumbnails');
    const btnCloseThumbs = document.getElementById('btnCloseThumbs');
    const btnFullscreen = document.getElementById('btnFullscreen');
    const progressBarContainer = document.getElementById('progressBarContainer');

    function formatIndex(n) {
      return n < 10 ? '0' + n : '' + n;
    }

    function showSlide(index) {
      if (index < 1) index = 1;
      if (index > totalSlides) index = totalSlides;
      currentSlide = index;

      const filename = `slide-${formatIndex(currentSlide)}.png`;
      slideImg.src = filename;
      currentNumEl.textContent = currentSlide;
      slideTitleEl.textContent = slideTitles[currentSlide - 1] || '';

      const pct = (currentSlide / totalSlides) * 100;
      progressBar.style.width = pct + '%';

      // Update active thumbnail
      document.querySelectorAll('.thumb-card').forEach((card, idx) => {
        if (idx === currentSlide - 1) {
          card.classList.add('active');
          card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        } else {
          card.classList.remove('active');
        }
      });
    }

    function nextSlide() {
      if (currentSlide < totalSlides) {
        showSlide(currentSlide + 1);
      }
    }

    function prevSlide() {
      if (currentSlide > 1) {
        showSlide(currentSlide - 1);
      }
    }

    // Initialize Thumbnail Grid
    function initThumbnails() {
      thumbGrid.innerHTML = '';
      for (let i = 1; i <= totalSlides; i++) {
        const card = document.createElement('div');
        card.className = `thumb-card ${i === currentSlide ? 'active' : ''}`;
        card.innerHTML = `
          <div class="thumb-number">${i}</div>
          <img src="slide-${formatIndex(i)}.png" alt="Slide ${i}" loading="lazy">
          <div class="thumb-card-title">${slideTitles[i - 1] || 'Slide ' + i}</div>
        `;
        card.onclick = () => {
          showSlide(i);
          thumbModal.classList.remove('open');
        };
        thumbGrid.appendChild(card);
      }
    }

    // Event Listeners
    prevBtn.onclick = prevSlide;
    nextBtn.onclick = nextSlide;

    btnThumbnails.onclick = () => {
      thumbModal.classList.toggle('open');
    };

    btnCloseThumbs.onclick = () => {
      thumbModal.classList.remove('open');
    };

    progressBarContainer.onclick = (e) => {
      const rect = progressBarContainer.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const pct = clickX / rect.width;
      const targetSlide = Math.max(1, Math.min(totalSlides, Math.round(pct * totalSlides)));
      showSlide(targetSlide);
    };

    btnFullscreen.onclick = () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    };

    // Keyboard Navigation
    window.addEventListener('keydown', (e) => {
      if (thumbModal.classList.contains('open')) {
        if (e.key === 'Escape') thumbModal.classList.remove('open');
        return;
      }

      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        prevSlide();
      } else if (e.key === 'Home') {
        e.preventDefault();
        showSlide(1);
      } else if (e.key === 'End') {
        e.preventDefault();
        showSlide(totalSlides);
      } else if (e.key === 'f' || e.key === 'F') {
        btnFullscreen.click();
      } else if (e.key === 't' || e.key === 'T') {
        thumbModal.classList.toggle('open');
      }
    });

    // Touch Swipe Support
    let touchStartX = 0;
    let touchEndX = 0;

    document.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
    }, false);

    document.addEventListener('touchend', e => {
      touchEndX = e.changedTouches[0].screenX;
      if (touchEndX < touchStartX - 50) nextSlide();
      if (touchEndX > touchStartX + 50) prevSlide();
    }, false);

    // Initial Load
    initThumbnails();
    showSlide(1);
  </script>
</body>
</html>
